name: Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode optional release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD_VAL: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS_VAL: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD_VAL: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "SIGNING_STORE_FILE=$PWD/app/release-keystore.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD_VAL" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS_VAL" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD_VAL" >> "$GITHUB_ENV"
          fi

      - name: Build minified release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage Agenda.apk
        run: cp app/build/outputs/apk/release/app-release.apk Agenda.apk

      - name: Generate version.json
        run: |
          VER_CODE=$((100 + ${{ github.run_number }}))
          VER_NAME="1.2.${{ github.run_number }}"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "commitSha": "%s",\n  "publishedAt": "%s",\n  "downloadUrl": "https://github.com/IliePapanaga/SIME-UI/releases/latest/download/Agenda.apk"\n}\n' \
            "$VER_CODE" "$VER_NAME" "${{ github.sha }}" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > version.json

      - name: Upload Agenda.apk workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-apk
          path: |
            Agenda.apk
            version.json
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Agenda {0}', github.ref_name) || 'Agenda (Latest Build)' }}
          files: |
            Agenda.apk
            version.json
          generate_release_notes: true
          make_latest: true
